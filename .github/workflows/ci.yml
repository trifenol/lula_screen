name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Testes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Bibliotecas do sistema (OpenCV no Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1

      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check faz_o_l.py tests --select F,E9

      - name: Testes
        run: pytest -q
